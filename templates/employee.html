<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexora · Employee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            NEXORA DATA SOLUTIONS · Training Operations Portal
        </div>
    </div>


    <!-- Main -->
    <div class="container">

        <div class="card">

            <div class="eyebrow">
                Employee workspace
            </div>

            <h1>
                Daily Data Entry Task
            </h1>

            <p class="muted">
                Complete today's 200 simulated records.
                Your score and right/wrong counts are intentionally not displayed.
            </p>


            <!-- Progress -->
            <div style="margin-top:24px;">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:8px;
                ">
                    <b id="count">
                        {{ completed }} / 200 completed
                    </b>

                    <span class="muted" style="font-size:13px;">
                        Daily task
                    </span>
                </div>

                <div class="progress">
                    <div
                        class="fill"
                        id="progressFill"
                        style="width:{{ completed / 2 }}%">
                    </div>
                </div>

            </div>


            <!-- Reference Data -->
            <div class="ref" id="ref" style="margin-top:24px;"></div>


            <!-- Data Entry Form -->
            <form
                method="post"
                action="/employee/submit"
                id="task"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <input
                    type="hidden"
                    name="index"
                    id="idx"
                    value="{{ completed }}"
                >

                <input
                    type="hidden"
                    name="seconds"
                    id="secs"
                    value="0"
                >


                <div class="grid">

                    <div>
                        <label>Name</label>

                        <input
                            name="name"
                            autocomplete="off"
                            required
                        >
                    </div>


                    <div>
                        <label>Age</label>

                        <input
                            name="age"
                            type="number"
                            autocomplete="off"
                            required
                        >
                    </div>


                    <div>
                        <label>City</label>

                        <input
                            name="city"
                            autocomplete="off"
                            required
                        >
                    </div>


                    <div>
                        <label>Phone</label>

                        <input
                            name="phone"
                            autocomplete="off"
                            required
                        >
                    </div>

                </div>


                <label>Email</label>

                <input
                    name="email"
                    type="email"
                    autocomplete="off"
                    required
                >


                <!-- Actions -->
                <div class="actions">

                    <button
                        type="reset"
                        class="secondary"
                    >
                        Clear
                    </button>

                    <button type="submit">
                        Submit &amp; Next
                    </button>

                </div>

            </form>


            <!-- Sign Out -->
            <p style="margin-top:20px;">
                <a href="/logout">
                    Sign out
                </a>
            </p>

        </div>

    </div>


<script>

const r = {{ records | tojson }};

let i = {{ completed }};

let start = Date.now();


function show() {

    /* Task completed */
    if (i >= 200) {

        document.querySelector(".card").innerHTML = `
            <div class="eyebrow">
                Task completed
            </div>

            <h1>
                Today's task completed
            </h1>

            <p class="muted">
                Your 200-record task has been submitted
                for authorized review.
            </p>

            <p style="margin-top:20px;">
                <a href="/logout">
                    Sign out
                </a>
            </p>
        `;

        return;
    }


    /* Current reference record */
    const x = r[i];


    document.getElementById("ref").innerHTML =
        "<b>Reference data</b><br>" +
        "Name: " + x.name + "<br>" +
        "Age: " + x.age + "<br>" +
        "City: " + x.city + "<br>" +
        "Phone: " + x.phone + "<br>" +
        "Email: " + x.email;


    document.getElementById("idx").value = i;

    document.getElementById("secs").value = 0;


    /* Progress text */
    document.getElementById("count").innerText =
        i + " / 200 completed";


    /* Progress bar */
    document.getElementById("progressFill").style.width =
        (i / 2) + "%";


    start = Date.now();
}


/* Calculate time spent on current record */
document.getElementById("task").addEventListener(
    "submit",
    function () {

        document.getElementById("secs").value =
            Math.floor(
                (Date.now() - start) / 1000
            );

    }
);


show();

</script>

</body>
</html>
