services:
  - type: web
    name: nexora-training-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FOUNDER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
    healthCheckPath: /health
databases:
  - name: nexora-postgres
    plan: basic-256mb
